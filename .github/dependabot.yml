version: 2

updates:
  # The audit job in ci.yml fails the build on a high/critical advisory in a
  # production dependency. A gate with nothing keeping dependencies current
  # eventually fires on an unrelated PR, and its author's only way forward is an
  # upgrade they never signed up for. These updates are the way forward,
  # arriving on their own schedule instead of on someone else's deadline.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps land as one PR per group. Individually they rarely
      # merit a review, and a single CI run across ten of them carries the same
      # signal as ten runs across one — at a tenth of the review cost.
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
        # monaco-editor is 0.x, where semver makes MINOR the breaking slot — so
        # "minor" here does not mean what it means for every other entry, and
        # grouping it hides a breaking change among routine ones. 0.55→0.56
        # changed the package's `exports` map and broke the
        # `monaco-editor/esm/vs/editor/editor.api` specifier `main.tsx` imports
        # (that import is deliberate: it keeps the TS/JSON/CSS/HTML language
        # services out of the bundle, which is what lets the CSP drop
        # 'unsafe-eval'). It arrives on its own from now on.
        exclude-patterns:
          - monaco-editor
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # Majors are deliberately left out of both groups, so they arrive one PR at
    # a time. react 19→20 or vite 7→8 is a change to read, not to batch.

  # Actions are pinned to commit SHAs (#138), which is what stops a mutable tag
  # from moving an unreviewed change into a job holding the deploy credentials.
  # A SHA cannot move on its own, so without something raising the pin forward
  # it rots into a permanently stale action; these updates are that something.
  # Dependabot rewrites the SHA and the trailing `# vN` comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # The one action the SHA-raising above cannot be trusted with. Upstream
      # publishes `v1` as both a tag and a branch: the tag is frozen at
      # 2021-03-03, the branch is where the action is maintained, and this repo
      # pins the branch head deliberately (see azure-static-web-apps.yml, which
      # explains why). Dependabot resolves `v1` to the tag, sees a SHA that is
      # not the pinned one, and proposes it as an update — so every run asks to
      # move the deploy BACKWARDS by three and a half years, onto a build that
      # predates the `skip_api_build` input the workflow passes. #219 was that
      # PR; the same regression had already been fixed once before it.
      #
      # The cost is that this pin no longer rots forward on its own. Raising it
      # means reading the v1 branch and updating the SHA by hand.
      - dependency-name: "Azure/static-web-apps-deploy"
