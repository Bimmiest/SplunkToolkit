name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Kept in step with .nvmrc and package.json "engines". Node 20 went
          # end-of-life in April 2026, so CI was building on an unsupported
          # runtime while .nvmrc pinned a non-LTS 25.x — neither matched the
          # other, nor what the deploy runs.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # `npm run build` is `tsc -b && vite build`, so this type-checks (a bare
        # `tsc --noEmit` against the solution-style root tsconfig — "files": [] —
        # would check zero files) AND produces the real artifact. Without the
        # bundler step, a bad asset reference or manualChunks drift passes PR
        # checks and only fails later, during the deploy on main.
        run: npm run build

      - name: Test
        run: npm test

      # Chromium only — the e2e suite covers browser-level wiring (CSP, worker
      # bundling, Monaco's chunk split), not cross-browser rendering, so the
      # other engines would cost minutes to re-assert the same facts.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        # Runs against a production build (the config rebuilds before serving,
        # so a stale dist/ can never be what gets tested). Guards the things
        # vitest cannot reach: the Content-Security-Policy, the pipeline Web
        # Worker round-trip, and that Monaco actually mounts.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Audit dependencies
        # Fails the build on a high/critical advisory. Production deps are what
        # ship to the browser, so they gate; dev-only advisories are reported
        # without failing (`|| true`) so a tooling CVE cannot block a fix.
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high || true
